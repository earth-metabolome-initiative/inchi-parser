name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          # Check markdown and Rust sources while excluding generated/git dirs.
          args: --verbose --no-progress --exclude-path './target/**' --exclude-path './.git/**' './**/*.md' './src/**/*.rs' './tests/**/*.rs'
          # Fail the action if broken links are found
          fail: true
